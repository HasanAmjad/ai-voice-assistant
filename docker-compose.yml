services:
  postgres:
    image: postgres:15
    container_name: voiceintent_db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./voiceintent_dump.sql:/docker-entrypoint-initdb.d/voiceintent_dump.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - voiceintent-network

  pipeline:
    build: .
    container_name: voiceintent_pipeline
    command: bash -c "echo 'Pipeline service ready - skipping full run for testing' && sleep 10"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./ml/saved_models:/app/ml/saved_models
      - ./gx:/app/gx
    networks:
      - voiceintent-network

  api:
    build: .
    container_name: voiceintent_api
    command: uvicorn serving.api:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ml/saved_models:/app/ml/saved_models
      - ./config:/app/config
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - voiceintent-network
    restart: unless-stopped

  dashboard:
    build: .
    container_name: voiceintent_dashboard
    command: streamlit run serving/dashboard.py --server.port 8501 --server.address 0.0.0.0
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./ml/saved_models:/app/ml/saved_models
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - voiceintent-network
    restart: unless-stopped

volumes:
  pgdata:
    driver: local

networks:
  voiceintent-network:
    driver: bridge
